<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#132b40">
  <meta name="description" content="近代沉舰考古专题展的交互式三维场馆。浏览全馆、平面与各展厅，旋转、缩放，查看船骸和展陈细节。">
  <title>近代沉舰考古专题展 · 三维场馆</title>
  <link rel="stylesheet" href="./assets/style.css">
</head>
<body>
  <main class="viewer" id="viewer">
    <header class="masthead">
      <a class="brand" href="#overview" aria-label="返回全馆总览">
        <svg viewBox="0 0 36 36" aria-hidden="true"><path d="M5 26h26M7 23l6-8 12-4-3 11H7zm6-8V6m0 5h10"/></svg>
        <span><span class="eyebrow">MARITIME ARCHAEOLOGY</span><h1>近代沉舰考古专题展</h1></span>
      </a>
      <div class="header-meta"><span class="live-dot"></span>三维场馆<span class="meta-divider">/</span><span>30 × 30 m</span><span class="meta-area">约 900 ㎡</span></div>
    </header>

    <section class="stage" aria-label="可旋转的场馆三维模型">
      <div id="canvas-wrap"></div>
      <div class="view-caption" aria-live="polite"><span class="caption-number" id="view-number">01</span><div><h2 id="view-title">全馆剖透</h2><p id="view-description">从整体空间开始，查看展厅布局与参观关系。</p></div></div>
      <div class="compass" title="北向"><span>N</span><svg id="compass-arrow" viewBox="0 0 36 36" aria-hidden="true"><path d="M18 4l8 26-8-6-8 6z"/></svg></div>
      <div class="stage-tools" aria-label="模型操作">
        <button id="reset-view" class="tool-button" type="button" title="重置当前视图"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1 7M4 4v6h6"/></svg><span>重置</span></button>
        <button id="fullscreen" class="tool-button" type="button" title="全屏浏览"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></svg><span>全屏</span></button>
      </div>
      <p class="interaction-hint"><span class="desktop-hint">拖动旋转<span>·</span>滚轮缩放<span>·</span>右键平移</span><span class="mobile-hint">单指旋转<span>·</span>双指缩放与平移</span></p>
      <div class="loading-overlay" id="loading-overlay" role="status" aria-live="polite">
        <img class="loading-poster" src="./assets/poster.jpg" alt="" aria-hidden="true">
        <div class="loading-content"><div class="loading-emblem" aria-hidden="true"><span></span><span></span><span></span></div><h2 id="loading-title">正在打开场馆</h2><p id="loading-detail">准备三维模型，请稍候</p><div class="progress-track"><div id="progress-fill"></div></div><span class="progress-number" id="progress-number">0%</span><button id="retry" type="button" hidden>重新加载</button></div>
      </div>
      <div class="notice" id="notice" role="status" aria-live="polite"></div>
    </section>

    <aside class="sidebar" aria-label="场馆浏览控制">
      <div class="panel-tabs" role="tablist" aria-label="浏览控制">
        <button id="views-tab" type="button" role="tab" aria-selected="true" aria-controls="views-panel">展厅视图</button>
        <button id="layers-tab" type="button" role="tab" aria-selected="false" aria-controls="layers-panel">模型图层</button>
      </div>
      <div id="views-panel" class="panel" role="tabpanel" aria-labelledby="views-tab">
        <p class="panel-intro">选择机位，进入展馆</p>
        <nav id="view-list" class="view-list" aria-label="预设浏览机位"></nav>
      </div>
      <div id="layers-panel" class="panel" role="tabpanel" aria-labelledby="layers-tab" hidden>
        <p class="panel-intro">按需展开空间与展陈细节</p>
        <div class="layer-list" id="layer-list"></div>
        <p class="layer-note">切换展厅时，图层随机位自动调整。</p>
      </div>
      <footer class="model-note"><span>参考图细化白模</span><p>以 30 × 30 米平面为基础；未标注的高度与细部尺寸按效果图推定。</p></footer>
    </aside>
  </main>
  <noscript><div class="noscript">请启用 JavaScript 后浏览三维场馆。</div></noscript>
  <script type="module" src="./assets/viewer.js"></script>
</body>
</html>

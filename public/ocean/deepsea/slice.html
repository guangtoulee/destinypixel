<body><header><div><h1>宝船结构切片C</h1><p>完整母船、半剖与32片真实结构 · 独立研究，尚未合入总馆</p></div><a href="/ocean/deepsea#gallery">返回深海考古提案 ↗</a></header>
<main class="layout"><div class="stage" id="slice-stage"><canvas id="slice-canvas" aria-label="可旋转观察的透明切片船模型"></canvas><div id="slice-status" class="status" role="status">正在打开独立切片模型…</div><div id="slice-caption" class="view-caption">校准观察位置</div></div>
<aside><h2>结构模式</h2><div class="views" id="slice-models"></div><h2>观察位置</h2><div class="views" id="slice-views"></div><p class="explain">从校准位置看切面叠合，换到侧面查看透明面板与分层。拖动可旋转，滚轮或双指可缩放。</p><div id="slice-panel-controls" hidden><h2>数字旋角试验</h2><label class="label" for="slice-panel">选择一片</label><select id="slice-panel" aria-label="选择切片面板"></select><label class="label" for="slice-angle">局部Y绝对旋角</label><input id="slice-angle" type="range" min="-3" max="3" step="0.05" value="0"><div class="angle"><span>−3°</span><output id="slice-angle-value" for="slice-angle">0°</output><span>3°</span></div><button class="reset" id="slice-reset">恢复全部校准角度</button></div><p class="note" id="slice-principle"></p><p class="note">实体主方案为固定静态透光图像与导光照明。数字调角后，可一键恢复各片校准角。</p><p class="note">船型为展陈艺术推演。浏览木色按源材质基色显示。</p></aside></main></body></html>

<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1260" viewBox="0 0 640 1260" role="img" aria-labelledby="title description">
<title id="title">2027 Ding-Wei: the connections</title><desc id="description">The annual branch is Wei, the Goat. Goat repeats that branch; Ox clashes with Wei, Rat harms Wei and Dog breaks with Wei in traditional branch tables. Ox, Goat and Dog form a xing group; conditions and interpretations differ. Goat is not in the common self-xing group of Dragon, Horse, Rooster and Pig.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#946e2d"/></marker></defs>
<rect width="640" height="1260" rx="32" fill="#f7f3e8"/>
<g font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" fill="#203d38">
<text x="36" y="54" font-size="21" fill="#946e2d" font-weight="600" text-anchor="start">DESTINYPIXEL · ORIGINAL DIAGRAM</text>
<text x="36" y="105" font-size="36" fill="#203d38" font-weight="650" text-anchor="start">2027 Ding-Wei</text>
<text x="36" y="151" font-size="30" fill="#52665e" font-weight="400" text-anchor="start">How the branches connect</text>
<rect x="116" y="190" width="408" height="147" rx="18" fill="#203d38" stroke="#203d38" stroke-width="2"/>
<text x="320" y="249" font-size="43" fill="#fffdf6" font-weight="650" text-anchor="middle">Wei 未 · Goat</text>
<text x="320" y="299" font-size="27" fill="#d9e5d8" font-weight="400" text-anchor="middle">The annual branch</text>
<path d="M320 341 L320 376" fill="none" stroke="#946e2d" stroke-width="3" marker-end="url(#arrow)"/>
<text x="320" y="421" font-size="27" fill="#203d38" font-weight="600" text-anchor="middle">Different links, not a bad-luck verdict</text>
<rect x="28" y="458" width="280" height="158" rx="18" fill="#e5eee5" stroke="#bdcbbc" stroke-width="2"/>
<text x="52" y="503" font-size="27" fill="#203d38" font-weight="650" text-anchor="start">Same branch</text>
<text x="52" y="548" font-size="30" fill="#203d38" font-weight="600" text-anchor="start">Goat 羊</text>
<text x="52" y="590" font-size="23" fill="#52665e" font-weight="400" text-anchor="start">Repeats Wei</text>
<rect x="332" y="458" width="280" height="158" rx="18" fill="#fffdf6" stroke="#bdcbbc" stroke-width="2"/>
<text x="356" y="503" font-size="27" fill="#203d38" font-weight="650" text-anchor="start">Clash · chong</text>
<text x="356" y="548" font-size="30" fill="#203d38" font-weight="600" text-anchor="start">Ox 牛</text>
<text x="356" y="590" font-size="23" fill="#52665e" font-weight="400" text-anchor="start">Chou 丑 ↔ Wei 未</text>
<rect x="28" y="642" width="280" height="158" rx="18" fill="#fffdf6" stroke="#bdcbbc" stroke-width="2"/>
<text x="52" y="687" font-size="27" fill="#203d38" font-weight="650" text-anchor="start">Harm · hai</text>
<text x="52" y="732" font-size="30" fill="#203d38" font-weight="600" text-anchor="start">Rat 鼠</text>
<text x="52" y="774" font-size="23" fill="#52665e" font-weight="400" text-anchor="start">Zi 子 ↔ Wei 未</text>
<rect x="332" y="642" width="280" height="158" rx="18" fill="#fffdf6" stroke="#bdcbbc" stroke-width="2"/>
<text x="356" y="687" font-size="27" fill="#203d38" font-weight="650" text-anchor="start">Break · po</text>
<text x="356" y="732" font-size="30" fill="#203d38" font-weight="600" text-anchor="start">Dog 狗</text>
<text x="356" y="774" font-size="23" fill="#52665e" font-weight="400" text-anchor="start">Xu 戌 ↔ Wei 未</text>
<rect x="28" y="856" width="584" height="220" rx="18" fill="#fffdf6" stroke="#946e2d" stroke-width="2" stroke-dasharray="9 7"/>
<text x="56" y="904" font-size="29" fill="#203d38" font-weight="650" text-anchor="start">Xing 刑 · Ox + Goat + Dog</text>
<text x="56" y="949" font-size="27" fill="#52665e" font-weight="400" text-anchor="start">A three-branch group; how to read</text>
<text x="56" y="991" font-size="27" fill="#52665e" font-weight="400" text-anchor="start">a pair and which conditions matter</text>
<text x="56" y="1033" font-size="27" fill="#203d38" font-weight="600" text-anchor="start">depends on the school of practice.</text>
<text x="36" y="1130" font-size="27" fill="#203d38" font-weight="600" text-anchor="start">Goat is not a common self-xing branch.</text>
<text x="36" y="1175" font-size="24" fill="#52665e" font-weight="400" text-anchor="start">These are traditional branch relationships.</text>
<text x="36" y="1217" font-size="23" fill="#52665e" font-weight="400" text-anchor="start">Use Ding-Wei after Lichun, not all January.</text>
</g></svg>

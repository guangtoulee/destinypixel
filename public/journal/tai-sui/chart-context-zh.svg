<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1180" viewBox="0 0 640 1180" role="img" aria-labelledby="title description">
<title id="title">生肖在八字的哪里？</title><desc id="description">生肖对应年柱的地支，不是完整年柱。年、月、日、时四柱组成原局，日干是日主。传统解读把原局、大运和流年合看；图形大小不表示权重。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#946e2d"/></marker></defs>
<rect width="640" height="1180" rx="32" fill="#f7f3e8"/>
<g font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" fill="#203d38">
<text x="36" y="54" font-size="21" fill="#946e2d" font-weight="600" text-anchor="start">DESTINYPIXEL · ORIGINAL DIAGRAM</text>
<text x="36" y="108" font-size="36" fill="#203d38" font-weight="650" text-anchor="start">生肖在八字的哪里？</text>
<text x="36" y="156" font-size="29" fill="#52665e" font-weight="400" text-anchor="start">从一个生肖，读到完整语境</text>
<rect x="28" y="190" width="584" height="534" rx="18" fill="#e5eee5" stroke="#bdcbbc" stroke-width="2"/>
<text x="54" y="239" font-size="31" fill="#203d38" font-weight="650" text-anchor="start">出生原局 · 四柱</text>
<rect x="52" y="267" width="254" height="199" rx="18" fill="#fffdf6" stroke="#bdcbbc" stroke-width="2"/>
<text x="76" y="314" font-size="31" fill="#203d38" font-weight="650" text-anchor="start">年柱</text>
<text x="76" y="359" font-size="28" fill="#52665e" font-weight="400" text-anchor="start">年干 + 年支</text>
<rect x="70" y="382" width="218" height="62" rx="18" fill="#e5eee5" stroke="#e5eee5" stroke-width="2"/>
<text x="179" y="423" font-size="26" fill="#203d38" font-weight="650" text-anchor="middle">年支 = 生肖</text>
<rect x="332" y="267" width="254" height="199" rx="18" fill="#fffdf6" stroke="#bdcbbc" stroke-width="2"/>
<text x="356" y="314" font-size="31" fill="#203d38" font-weight="650" text-anchor="start">月柱</text>
<text x="356" y="359" font-size="28" fill="#52665e" font-weight="400" text-anchor="start">月干 + 月支</text>
<rect x="52" y="490" width="254" height="199" rx="18" fill="#fffdf6" stroke="#bdcbbc" stroke-width="2"/>
<text x="76" y="537" font-size="31" fill="#203d38" font-weight="650" text-anchor="start">日柱</text>
<text x="76" y="582" font-size="28" fill="#52665e" font-weight="400" text-anchor="start">日干 + 日支</text>
<rect x="70" y="605" width="218" height="62" rx="18" fill="#e5eee5" stroke="#e5eee5" stroke-width="2"/>
<text x="179" y="646" font-size="24" fill="#203d38" font-weight="650" text-anchor="middle">日干 = 日主</text>
<rect x="332" y="490" width="254" height="199" rx="18" fill="#fffdf6" stroke="#bdcbbc" stroke-width="2"/>
<text x="356" y="537" font-size="31" fill="#203d38" font-weight="650" text-anchor="start">时柱</text>
<text x="356" y="582" font-size="28" fill="#52665e" font-weight="400" text-anchor="start">时干 + 时支</text>
<text x="356" y="638" font-size="23" fill="#52665e" font-weight="400" text-anchor="start">时辰未知则留空</text>
<path d="M320 727 L320 772" fill="none" stroke="#946e2d" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="28" y="797" width="280" height="164" rx="18" fill="#fffdf6" stroke="#bdcbbc" stroke-width="2"/>
<text x="52" y="842" font-size="34" fill="#203d38" font-weight="650" text-anchor="start">大运</text>
<text x="52" y="886" font-size="23" fill="#52665e" font-weight="400" text-anchor="start">传统的十年阶段</text>
<text x="52" y="927" font-size="22" fill="#52665e" font-weight="400" text-anchor="start">起运时间另行推算</text>
<rect x="332" y="797" width="280" height="164" rx="18" fill="#fffdf6" stroke="#bdcbbc" stroke-width="2"/>
<text x="356" y="842" font-size="34" fill="#203d38" font-weight="650" text-anchor="start">流年</text>
<text x="356" y="886" font-size="23" fill="#52665e" font-weight="400" text-anchor="start">当年的干支</text>
<text x="356" y="927" font-size="22" fill="#52665e" font-weight="400" text-anchor="start">不只看生肖碰生肖</text>
<path d="M168 967 L269 1016" fill="none" stroke="#946e2d" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M472 967 L371 1016" fill="none" stroke="#946e2d" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="28" y="1038" width="584" height="105" rx="18" fill="#203d38" stroke="#203d38" stroke-width="2"/>
<text x="320" y="1080" font-size="28" fill="#fffdf6" font-weight="650" text-anchor="middle">原局、大运、流年：放在一起读</text>
<text x="320" y="1119" font-size="23" fill="#d9e5d8" font-weight="400" text-anchor="middle">图框大小不代表权重，也不是预测公式</text>
</g></svg>

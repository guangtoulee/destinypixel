<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1180" viewBox="0 0 640 1180" role="img" aria-labelledby="title description">
<title id="title">Where does the zodiac fit?</title><desc id="description">The zodiac animal is the branch within the year pillar, not the whole pillar. Year, month, day and hour form the natal structure. The day stem is the Day Master. Traditional interpretation considers the natal structure, long phases and annual cycle together. Box sizes do not represent weights.</desc>

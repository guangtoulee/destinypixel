<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1260" viewBox="0 0 640 1260" role="img" aria-labelledby="title description">
<title id="title">2027 丁未：关系怎么连？</title><desc id="description">丁未年的年支为未羊。羊值太岁，丑牛与未相冲，子鼠与未相害，戌狗与未相破。丑未戌属于三刑讨论的组合，是否需要三支齐全、如何读两支及强弱有不同口径；未不在常见辰午酉亥自刑组内。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#946e2d"/></marker></defs>
<rect width="640" height="1260" rx="32" fill="#f7f3e8"/>
<g font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" fill="#203d38">
<text x="36" y="54" font-size="21" fill="#946e2d" font-weight="600" text-anchor="start">DESTINYPIXEL · ORIGINAL DIAGRAM</text>
<text x="36" y="108" font-size="34" fill="#203d38" font-weight="650" text-anchor="start">2027 丁未：关系怎么连？</text>
<rect x="116" y="190" width="408" height="147" rx="18" fill="#203d38" stroke="#203d38" stroke-width="2"/>
<text x="320" y="249" font-size="43" fill="#fffdf6" font-weight="650" text-anchor="middle">未 · 羊</text>
<text x="320" y="299" font-size="27" fill="#d9e5d8" font-weight="400" text-anchor="middle">2027 流年地支</text>
<path d="M320 341 L320 376" fill="none" stroke="#946e2d" stroke-width="3" marker-end="url(#arrow)"/>
<text x="320" y="421" font-size="27" fill="#203d38" font-weight="600" text-anchor="middle">四种不同关系，不是四张坏消息</text>
<rect x="28" y="458" width="280" height="158" rx="18" fill="#e5eee5" stroke="#bdcbbc" stroke-width="2"/>
<text x="52" y="503" font-size="32" fill="#203d38" font-weight="650" text-anchor="start">值 · 羊</text>
<text x="52" y="563" font-size="29" fill="#52665e" font-weight="400" text-anchor="start">年支与流年相同</text>
<rect x="332" y="458" width="280" height="158" rx="18" fill="#fffdf6" stroke="#bdcbbc" stroke-width="2"/>
<text x="356" y="503" font-size="32" fill="#203d38" font-weight="650" text-anchor="start">冲 · 牛</text>
<text x="356" y="563" font-size="29" fill="#52665e" font-weight="400" text-anchor="start">丑 ↔ 未</text>
<rect x="28" y="642" width="280" height="158" rx="18" fill="#fffdf6" stroke="#bdcbbc" stroke-width="2"/>
<text x="52" y="687" font-size="32" fill="#203d38" font-weight="650" text-anchor="start">害 · 鼠</text>
<text x="52" y="747" font-size="29" fill="#52665e" font-weight="400" text-anchor="start">子 ↔ 未</text>
<rect x="332" y="642" width="280" height="158" rx="18" fill="#fffdf6" stroke="#bdcbbc" stroke-width="2"/>
<text x="356" y="687" font-size="32" fill="#203d38" font-weight="650" text-anchor="start">破 · 狗</text>
<text x="356" y="747" font-size="29" fill="#52665e" font-weight="400" text-anchor="start">戌 ↔ 未</text>
<rect x="28" y="856" width="584" height="220" rx="18" fill="#fffdf6" stroke="#946e2d" stroke-width="2" stroke-dasharray="9 7"/>
<text x="56" y="904" font-size="31" fill="#203d38" font-weight="650" text-anchor="start">刑 · 丑牛 + 未羊 + 戌狗</text>
<text x="56" y="949" font-size="27" fill="#52665e" font-weight="400" text-anchor="start">是否三支齐全、两支如何读</text>
<text x="56" y="991" font-size="27" fill="#52665e" font-weight="400" text-anchor="start">以及成刑条件，存在不同口径</text>
<text x="56" y="1033" font-size="27" fill="#203d38" font-weight="600" text-anchor="start">不能叠加成“加倍倒霉”</text>
<text x="36" y="1130" font-size="27" fill="#203d38" font-weight="600" text-anchor="start">羊不在常见“辰午酉亥自刑”组内</text>
<text x="36" y="1175" font-size="24" fill="#52665e" font-weight="400" text-anchor="start">图示采用常见地支关系；刑法须读条件。</text>
<text x="36" y="1217" font-size="23" fill="#52665e" font-weight="400" text-anchor="start">适用丁未段；公历 1 月及立春前另看丙午。</text>
</g></svg>

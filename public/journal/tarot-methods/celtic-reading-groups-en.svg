<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" role="img" aria-labelledby="title desc">
<title id="title">Give each position a job</title>
<desc id="desc">Our teaching exercise · numbers match the tool; 1 + 2 Situation and influence; 3 + 4 + 5 Background and attention; 6 + 7 + 8 Direction and conditions; 9 + 10 Concerns and overall direction</desc>
<rect width="600" height="800" rx="22" fill="#faf7f1"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#302d2a">
<text x="30" y="48" font-size="29" font-weight="600">Give each position a job</text>
<text x="30" y="78" font-size="18" fill="#68615c">Our teaching exercise · numbers match the tool</text>
<rect x="24" y="105" width="552" height="137" rx="14" fill="#eee6d7"/>
<text x="44" y="140" font-size="25" font-weight="600" fill="#665547">1 + 2</text>
<text x="44" y="174" font-size="24" font-weight="600">Situation and influence</text>
<text x="44" y="206" font-size="20" fill="#504a45">Present situation × Crossing influence</text>
<path d="M300 246 v10 m-5 -4 5 5 5 -5" fill="none" stroke="#8b7c70" stroke-width="2"/>
<rect x="24" y="261" width="552" height="137" rx="14" fill="#e9e6ef"/>
<text x="44" y="296" font-size="25" font-weight="600" fill="#665547">3 + 4 + 5</text>
<text x="44" y="330" font-size="24" font-weight="600">Background and attention</text>
<text x="44" y="362" font-size="20" fill="#504a45">Underlying pattern · Recent past</text>
<text x="44" y="387" font-size="20" fill="#504a45">Conscious focus</text>
<path d="M300 402 v10 m-5 -4 5 5 5 -5" fill="none" stroke="#8b7c70" stroke-width="2"/>
<rect x="24" y="417" width="552" height="137" rx="14" fill="#e2ece8"/>
<text x="44" y="452" font-size="25" font-weight="600" fill="#665547">6 + 7 + 8</text>
<text x="44" y="486" font-size="24" font-weight="600">Direction and conditions</text>
<text x="44" y="518" font-size="20" fill="#504a45">Possible direction · Your approach</text>
<text x="44" y="543" font-size="20" fill="#504a45">Surroundings</text>
<path d="M300 558 v10 m-5 -4 5 5 5 -5" fill="none" stroke="#8b7c70" stroke-width="2"/>
<rect x="24" y="573" width="552" height="137" rx="14" fill="#f0e4df"/>
<text x="44" y="608" font-size="25" font-weight="600" fill="#665547">9 + 10</text>
<text x="44" y="642" font-size="24" font-weight="600">Concerns and overall direction</text>
<text x="44" y="674" font-size="20" fill="#504a45">Hopes and concerns × Potential outcome</text>
<text x="30" y="772" font-size="17" fill="#68615c">Start with known facts. Finish with a step you can check.</text>
</g></svg>
